<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Histogramme Paris</title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #eef2f7;
    }

    h1 {
      text-align: center;
      color: #243b55;
    }

    #chart {
      width: 100%;
      height: 520px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      padding: 20px;
    }
  </style>
</head>

<body>
  <h1>Histogramme des températures — Paris</h1>
  <div id="chart"></div>

  <script>
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(init);

    async function init() {
      const response = await fetch('/paris');
      const json = await response.json();

      const data = new google.visualization.DataTable();
      data.addColumn('string', 'Heure');
      data.addColumn('number', 'Température °C');

      json.slice(0, 24).forEach(item => {
        data.addRow([item.datetime.replace('T', ' '), Number(item.temperature_c)]);
      });

      const options = {
        title: 'Températures de Paris sur les prochaines 24h',
        legend: { position: 'none' },
        hAxis: { title: 'Date / Heure' },
        vAxis: { title: 'Température °C' }
      };

      const chart = new google.visualization.ColumnChart(document.getElementById('chart'));
      chart.draw(data, options);
    }
  </script>
</body>
</html>
