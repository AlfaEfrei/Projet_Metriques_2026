<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Histogramme Paris</title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #eef2f7;
    }

    h1 {
      text-align: center;
      color: #243b55;
      padding: 30px;
      margin: 0;
    }

    .card {
      background: white;
      margin: 30px;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    #chart {
      width: 100%;
      height: 550px;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      color: #444;
    }
  </style>
</head>

<body>
  <h1>Histogramme des températures — Paris</h1>

  <div class="card">
    <div id="chart"></div>
    <div id="status">Chargement des données...</div>
  </div>

  <script>
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(init);

    async function init() {
      try {
        const response = await fetch('/paris');

        if (!response.ok) {
          throw new Error('Erreur HTTP ' + response.status);
        }

        const json = await response.json();

        const data = new google.visualization.DataTable();
        data.addColumn('string', 'Heure');
        data.addColumn('number', 'Température °C');

        json.slice(0, 24).forEach(item => {
          const heure = item.datetime.substring(11, 16);
          data.addRow([heure, Number(item.temperature_c)]);
        });

        const options = {
          title: 'Températures de Paris sur les prochaines 24 heures',
          legend: { position: 'none' },
          hAxis: {
            title: 'Heure'
          },
          vAxis: {
            title: 'Température °C'
          }
        };

        const chart = new google.visualization.ColumnChart(document.getElementById('chart'));
        chart.draw(data, options);

        document.getElementById('status').textContent =
          'OK — Histogramme chargé avec ' + data.getNumberOfRows() + ' valeurs.';
      } catch (error) {
        document.getElementById('status').textContent = 'Erreur : ' + error.message;
        console.error(error);
      }
    }
  </script>
</body>
</html>
