<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Graphique Paris</title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f5f7fa;
    }

    h1 {
      text-align: center;
      color: #1e3c72;
    }

    #chart {
      width: 100%;
      height: 520px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      padding: 20px;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      color: #444;
    }
  </style>
</head>

<body>
  <h1>Températures horaires — Paris</h1>
  <div id="chart"></div>
  <div id="status"></div>

  <script>
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(init);

    async function init() {
      const response = await fetch('/paris');
      const json = await response.json();

      const rows = json.map(item => {
        const date = new Date(item.datetime);
        const temp = Number(item.temperature_c);
        return [date, temp];
      });

      const data = new google.visualization.DataTable();
      data.addColumn('datetime', 'Date / Heure');
      data.addColumn('number', 'Température °C');
      data.addRows(rows);

      const options = {
        title: 'Température à Paris sur 7 jours',
        legend: { position: 'bottom' },
        hAxis: { title: 'Date / Heure', format: 'dd/MM HH:mm' },
        vAxis: { title: 'Température °C' },
        explorer: { actions: ['dragToZoom', 'rightClickToReset'] }
      };

      const chart = new google.visualization.LineChart(document.getElementById('chart'));
      chart.draw(data, options);

      document.getElementById('status').textContent = 'OK — ' + rows.length + ' points chargés depuis /paris';
    }
  </script>
</body>
</html>
