<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Contact</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .card {
      background: white;
      width: 430px;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }

    h1 {
      color: #1e3c72;
      text-align: center;
    }

    p {
      text-align: center;
      color: #555;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      margin-top: 16px;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #1e3c72;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #2a5298;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Contact</h1>
    <p>Laissez-moi un message</p>

    <form>
      <input type="text" placeholder="Votre nom">
      <input type="text" placeholder="Votre prénom">
      <textarea rows="5" placeholder="Votre message"></textarea>
      <button type="button">Envoyer</button>
    </form>
  </div>
</body>
</html>
