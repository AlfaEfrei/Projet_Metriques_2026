<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Atelier Métriques</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      color: white;
    }

    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      color: #1f2937;
      max-width: 900px;
      width: 100%;
      padding: 45px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #e0ecff;
      color: #1e3c72;
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 48px;
      margin: 10px 0;
      color: #1e3c72;
    }

    h2 {
      font-size: 28px;
      margin: 10px 0 20px;
      color: #2a5298;
    }

    p {
      font-size: 18px;
      color: #555;
      line-height: 1.6;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 35px;
    }

    a {
      text-decoration: none;
      background: #1e3c72;
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-weight: bold;
      transition: 0.2s;
    }

    a:hover {
      background: #2a5298;
      transform: translateY(-3px);
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <div class="badge">Projet Python Flask API</div>

      <h1>ATELIER MÉTRIQUES</h1>
      <h2>Alex Famechon</h2>

      <p>
        Bienvenue sur mon application Flask dédiée à la création de métriques,
        d’API et de graphiques interactifs avec Python.
      </p>

      <div class="links">
        <a href="/contact">Contact</a>
        <a href="/paris">API Paris</a>
        <a href="/rapport">Graphique</a>
        <a href="/histogramme">Histogramme</a>
        <a href="/atelier">Atelier</a>
      </div>

      <div class="footer">
        Application réalisée avec Flask, Open-Meteo et Google Charts.
      </div>
    </div>
  </div>
</body>
</html>
